<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOSIL — Access</title>
    <link rel="icon" type="image/svg+xml" href="/icons/ai-avatar.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .password-container {
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid rgba(179, 136, 255, 0.2);
            border-radius: 20px;
            padding: 3rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 40px rgba(179, 136, 255, 0.1);
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2rem;
            animation: fadeInDown 0.7s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-ring {
            width: 44px;
            height: 44px;
            border: 3px solid #b388ff;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-ring::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #b388ff 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.8;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #b388ff 0%, #8b7eeb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            color: #e8e8ed;
            margin-bottom: 0.5rem;
            animation: fadeIn 0.8s ease-out 0.1s backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .subtitle {
            font-size: 13px;
            text-align: center;
            color: #8a8a9a;
            margin-bottom: 2.5rem;
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }

        .form-group {
            margin-bottom: 1.5rem;
            animation: fadeIn 0.8s ease-out 0.3s backwards;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #c0c0d0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 15, 15, 0.6);
            border: 1.5px solid rgba(179, 136, 255, 0.3);
            border-radius: 12px;
            color: #e8e8ed;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="password"]:hover {
            border-color: rgba(179, 136, 255, 0.5);
            background: rgba(15, 15, 15, 0.8);
        }

        input[type="password"]:focus {
            border-color: #b388ff;
            background: rgba(15, 15, 15, 0.9);
            box-shadow: 0 0 0 3px rgba(179, 136, 255, 0.1);
        }

        input[type="password"]::placeholder {
            color: #5a5a6a;
        }

        .button-group {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.8s ease-out 0.4s backwards;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        .btn-submit {
            background: linear-gradient(135deg, #b388ff 0%, #8b7eeb 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(179, 136, 255, 0.3);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(179, 136, 255, 0.4);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            font-size: 13px;
            color: #f87171;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 1.5rem;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .error-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-text {
            display: inline;
        }

        .btn-submit:disabled .btn-text {
            display: none;
        }

        .btn-submit:disabled .loading-spinner {
            display: inline-block;
        }

        .info-text {
            font-size: 12px;
            text-align: center;
            color: #5a5a6a;
            margin-top: 2rem;
            animation: fadeIn 0.8s ease-out 0.5s backwards;
        }

        .info-text a {
            color: #b388ff;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .info-text a:hover {
            color: #8b7eeb;
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .password-container {
                padding: 2rem 1.5rem;
                border-radius: 16px;
            }

            h1 {
                font-size: 18px;
            }

            .logo-container {
                margin-bottom: 1.5rem;
            }

            .subtitle {
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="password-container">
        <div class="logo-container">
            <div class="logo-ring"></div>
            <div class="logo-text">VOSIL</div>
        </div>

        <h1>Access Required</h1>
        <p class="subtitle">Enter the password to continue</p>

        <div class="error-message" id="error-message"></div>

        <form id="password-form" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                    autofocus
                />
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit" id="submit-btn">
                    <span class="btn-text">Access</span>
                    <span class="loading-spinner"></span>
                </button>
            </div>
        </form>

        <div class="info-text">
            VOSIL — Advanced Conversational AI
        </div>
    </div>

    <script>
        const form = document.getElementById('password-form');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');

        async function handleSubmit(e) {
            e.preventDefault();
            
            const password = passwordInput.value;
            if (!password) return;

            // Clear previous error
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            // Disable button and show loading
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Redirect to chat
                    window.location.href = '/chat';
                } else {
                    // Show error
                    errorMessage.textContent = data.error || 'Incorrect password. Please try again.';
                    errorMessage.classList.add('show');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (err) {
                console.error('Authentication error:', err);
                errorMessage.textContent = 'Connection error. Please try again.';
                errorMessage.classList.add('show');
            } finally {
                submitBtn.disabled = false;
            }
        }

        // Focus on password input on load
        window.addEventListener('load', () => {
            passwordInput.focus();
        });

        // Allow Enter key to submit
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
